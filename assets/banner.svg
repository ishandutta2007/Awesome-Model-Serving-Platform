<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Animations -->
    <style>
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulse-glow {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.7; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -80; }
      }
      .floating-node-1 { animation: float 6s ease-in-out infinite; transform-origin: center; }
      .floating-node-2 { animation: float 8s ease-in-out infinite 1s; transform-origin: center; }
      .floating-node-3 { animation: float 7s ease-in-out infinite 2s; transform-origin: center; }
      .glowing-orb { animation: pulse-glow 5s ease-in-out infinite; transform-origin: center; }
      .network-line { stroke-dasharray: 10, 10; animation: dash 4s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="300" fill="url(#grid)" rx="16"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="glowing-orb" cx="200" cy="150" r="180" fill="url(#glow-grad)"/>
  <circle class="glowing-orb" cx="1000" cy="100" r="220" fill="url(#glow-grad)"/>

  <!-- Animated Neural Network Data Flow Background Graphics -->
  <g stroke="rgba(99, 102, 241, 0.25)" stroke-width="2">
    <line x1="100" y1="220" x2="300" y2="80" class="network-line"/>
    <line x1="300" y1="80" x2="550" y2="240" class="network-line"/>
    <line x1="650" y1="60" x2="900" y2="220" class="network-line"/>
    <line x1="900" y1="220" x2="1100" y2="100" class="network-line"/>
  </g>

  <!-- Floating Nodes (Behind text layer) -->
  <g class="floating-node-1" opacity="0.4">
    <circle cx="150" cy="80" r="8" fill="#38bdf8"/>
    <circle cx="150" cy="80" r="16" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <g class="floating-node-2" opacity="0.4">
    <circle cx="1050" cy="220" r="10" fill="#a855f7"/>
    <circle cx="1050" cy="220" r="20" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  </g>

  <g class="floating-node-3" opacity="0.3">
    <circle cx="950" cy="70" r="6" fill="#818cf8"/>
  </g>

  <!-- Foreground Foreground Container (Guarantees Title & Subtitle Visibility) -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Subtitle Badge -->
    <rect x="420" y="42" width="360" height="32" rx="16" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="600" y="63" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="2">PRODUCTION ML &amp; LLM INFERENCE</text>

    <!-- Main Title -->
    <text x="600" y="140" font-size="46" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.5">
      Awesome Model Serving Platform
    </text>

    <!-- Subtitle Description -->
    <text x="600" y="195" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
      Curated SaaS Products, Open-Source Runtimes, GPU Optimizations &amp; Kubernetes Serving
    </text>

    <!-- Feature Tags -->
    <g transform="translate(340, 228)" font-size="12" font-weight="500" fill="#cbd5e1">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="140" height="26" rx="6" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(99, 102, 241, 0.4)"/>
      <text x="70" y="17" fill="#818cf8">⚡ High Throughput</text>

      <!-- Tag 2 -->
      <rect x="160" y="0" width="160" height="26" rx="6" fill="rgba(56, 189, 248, 0.2)" stroke="rgba(56, 189, 248, 0.4)"/>
      <text x="240" y="17" fill="#38bdf8">☸️ Kubernetes Native</text>

      <!-- Tag 3 -->
      <rect x="340" y="0" width="180" height="26" rx="6" fill="rgba(168, 85, 247, 0.2)" stroke="rgba(168, 85, 247, 0.4)"/>
      <text x="430" y="17" fill="#c084fc">🚀 Serverless Inference</text>
    </g>
  </g>
</svg>
